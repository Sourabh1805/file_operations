services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      
    volumes:
      - ./api:/api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  tests:
    build:
      context: .
      args:
        ENV: test
    environment:
      - ENV=test
    volumes:
      - .:/app
    command: ["pytest"]